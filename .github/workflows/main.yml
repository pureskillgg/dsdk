---
name: main

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python_version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup
        uses: ./.github/actions/setup
        with:
          python_version: ${{ matrix.python_version }}
      - name: Test
        run: make test
  test-pandas-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install pandas 2.3, the lowest supported version
        run: uv pip install "pandas==2.3.3"
      - name: Test
        run: make test
        env:
          UV_NO_SYNC: '1'
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: make lint
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build
        run: make build
